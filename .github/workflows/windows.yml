name: Windows x64

on:
  push:
    branches: [feat/initial-implementation]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.404
      - name: Install pinned tools and engines
        run: ./installer/Install-WindowsDependencies.ps1 -BuildTools
      - name: Build, test and package development candidate
        run: ./installer/Build-WindowsRelease.ps1 -Development
      - name: Upload development installer and identity package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: FileShift-Development-win-x64
          path: dist/installer/*
          if-no-files-found: error
      - name: Upload portable Windows binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: FileShift-portable-win-x64
          path: dist/win-x64/
          if-no-files-found: error
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Windows-test-results
          path: dist/test-results/*.trx
